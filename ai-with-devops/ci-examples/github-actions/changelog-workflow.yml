name: Generate changelog (example)

on:
  push:
    branches: [ 'release/*' ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Generate changelog (mock)
        run: |
          python labs/02-llm-ci-cd/starter/changelog_gen.py commits.txt || true
      - name: Create PR with changelog (demo)
        run: |
          echo "This step would create a PR in a real demo. Use GITHUB_TOKEN and a safe test repo."

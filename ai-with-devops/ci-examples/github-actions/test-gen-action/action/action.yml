name: "PR Test Commenter (demo)"
description: "Posts a comment to a PR using GITHUB_TOKEN, or prints the comment when no token is provided (safe demo)."
inputs:
  comment-file:
    description: "Optional path to a file containing the comment body (relative to workspace). If omitted the action reads stdin."
    required: false

runs:
  using: "composite"
  steps:
    - name: Run commenter
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.comment-file }}" ]; then
          python "${{ github.action_path }}/entrypoint.py" "${{ inputs.comment-file }}"
        else
          # read from stdin
          python "${{ github.action_path }}/entrypoint.py"
        fi
